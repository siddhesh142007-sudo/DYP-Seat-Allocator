services:
  db:
    image: postgres:16-alpine
    container_name: exam-seating-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seating}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seating_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-exam_seating}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seating} -d ${POSTGRES_DB:-exam_seating}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    container_name: exam-seating-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-seating}:${POSTGRES_PASSWORD:-seating_dev_password}@db:5432/${POSTGRES_DB:-exam_seating}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_generate_openssl_rand_hex_64}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_generate_openssl_rand_hex_64}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-604800}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEATING_TIME_BUDGET_MS: ${SEATING_TIME_BUDGET_MS:-10000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: exam-seating-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      BACKEND_PROXY_TARGET: http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
