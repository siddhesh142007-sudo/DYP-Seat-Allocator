name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seating
          POSTGRES_PASSWORD: seating_dev_password
          POSTGRES_DB: exam_seating_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U seating -d exam_seating_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://seating:seating_dev_password@localhost:5432/exam_seating_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ./backend
      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: ./backend
      - name: Lint
        run: npm run lint
        working-directory: ./backend
      - name: Typecheck
        run: npm run typecheck
        working-directory: ./backend
      - name: Run tests
        run: npm run test
        working-directory: ./backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Lint
        run: npm run lint
        working-directory: ./frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: ./frontend
      - name: Run tests
        run: npm run test
        working-directory: ./frontend
      - name: Build
        run: npm run build
        working-directory: ./frontend